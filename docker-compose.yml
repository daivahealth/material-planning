services:
  db:
    image: postgres:16-alpine
    container_name: matplan_db
    environment:
      POSTGRES_USER: matplan
      POSTGRES_PASSWORD: matplan
      POSTGRES_DB: matplan
      # Container/DB timezone — one deploy-time knob (default Asia/Kolkata).
      # Drives Postgres' default TimeZone and log timestamps.
      TZ: "${TZ:-Asia/Kolkata}"
      PGTZ: "${TZ:-Asia/Kolkata}"
    ports:
      - "14045:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matplan"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: matplan_backend
    environment:
      DATABASE_URL: postgresql://matplan:matplan@db:5432/matplan
      PYTHONUNBUFFERED: "1"
      # Secrets — supply via a .env file (see .env.example); never commit real
      # values. The dev fallbacks below keep `docker compose up` working
      # locally; docker-compose.prod.yml requires them to be set explicitly.
      MINING_SECRET_KEY: "${MINING_SECRET_KEY:-pIGqOca8iKkeGdeI8VTlJJvqcriKkECZv_cZs6IoVvo=}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-}"
      ADMIN_INITIAL_PASSWORD: "${ADMIN_INITIAL_PASSWORD:-}"
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-http://localhost:14030,http://127.0.0.1:14030}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      RELOAD: "1"
      # Timezone — single deploy-time knob. TZ sets the OS/container clock and
      # log timestamps; TIMEZONE feeds the app (pytz) for scheduling + the
      # created_at/published_at it stamps. Keep them equal. Default Asia/Kolkata.
      TZ: "${TZ:-Asia/Kolkata}"
      TIMEZONE: "${TZ:-Asia/Kolkata}"
      KAFKA_BROKERS: "${KAFKA_BROKERS:-localhost:9092}"
    ports:
      - "14020:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh /app/start.sh

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the compiled bundle at image-build time.
        # Context/base path the app is served under (default "/" = root),
        # e.g. "/material-planning/". Rebuild the image to change it.
        APP_BASE: "${APP_BASE:-/}"
        # Where the browser reaches the backend API. Blank → inferred as
        # http(s)://<current-host>:14020; set for other hosts/ports.
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-}"
        # Environment ribbon shown in the page corner (e.g. "UAT").
        # Blank (default) = no ribbon, which is what production should use.
        VITE_ENV_RIBBON: "${VITE_ENV_RIBBON:-}"
        VITE_ENV_RIBBON_COLOR: "${VITE_ENV_RIBBON_COLOR:-}"
        VITE_ENV_RIBBON_TEXT_COLOR: "${VITE_ENV_RIBBON_TEXT_COLOR:-}"
    container_name: matplan_frontend
    environment:
      # Needed at runtime so `vite preview` serves under the same base.
      APP_BASE: "${APP_BASE:-/}"
      TZ: "${TZ:-Asia/Kolkata}"
    ports:
      - "14030:5173"
    depends_on:
      - backend

volumes:
  pgdata:
